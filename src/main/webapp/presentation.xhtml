<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet name="css/mycsslayout.css"/>
    <title>Présentation Utilisateur</title>
</h:head>
<h:body>
    <div class="main-container" style="max-width: 520px; margin-top: 60px;">
        <div class="app-card" style="text-align: center;">
            <div class="app-header" style="justify-content: center;">
                <h2 class="app-title">👋 Formulaire de Présentation</h2>
            </div>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">
                Veuillez renseigner votre nom pour personnaliser la salutation.
            </p>

            <h:form>
                <div style="margin-bottom: 20px; text-align: left;">
                    <label class="field-label" style="display: block; margin-bottom: 8px;">Votre Nom :</label>
                    <h:inputText value="#{utilisateur.nom}" style="padding: 10px;"/>
                </div>

                <div style="margin-top: 15px;">
                    <h:commandButton value="Valider et continuer ➔" action="#{utilisateur.direHello()}" styleClass="btn-primary" style="width: 100%;"/>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
